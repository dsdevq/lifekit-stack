[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-agent"
version = "0.1.0"
description = "Resident operations agent — watches devclaw for stuck/blocked goals (ops-PR2: O1 + cognition + L1 evaluate-goal)."
requires-python = ">=3.11"
# ops-PR2 adds httpx for the devclaw MCP client. The claude CLI is invoked
# as a subprocess (no SDK dep) — installed in the container via npm, mirroring
# the devclaw-mcp pattern. No openai/litellm — cognition is exactly the
# ``claude --print`` path the rest of the stack uses.
dependencies = [
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
ops-agent = "ops_agent.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["ops_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []
