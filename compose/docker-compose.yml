# lifekit-stack compose file.
#
# Services:
#   openclaw-gateway     — the runtime gateway (channels, cron, skills, agent); loopback bind on 18789
#   openclaw-cli         — same image, sharing the gateway's netns for one-shot `openclaw <command>` invocations.
#                          On-demand only (compose profile `cli`); not started by `docker compose up -d`.
#                          Invoke via: `docker compose --profile cli run --rm openclaw-cli <command>`
#   lifekit-dashboard    — read-only web UI over ~/memory and ~/.openclaw/workspace; loopback bind on 18790
#   google-workspace-mcp — taylorwilsdon/google_workspace_mcp, internal-only on :8000 (reached via compose DNS)
#   devclaw-mcp          — DevClaw v2 MCP server (autonomous coding via OpenHands); internal-only on :8000
#   notify-relay         — turns devclaw's notify_url POST into a Telegram message via the gateway CLI; internal-only on :8090
#
# Retired in the 2026-05-27 v2 cutover:
#   lifekit-orchestrator — v1 LangGraph scheduler; replaced by devclaw-mcp's in-process queue.
#
# Run from the repo root after `scripts/bootstrap-vps.sh` has set up the host:
#   cd /srv/lifekit-stack && ./scripts/deploy.sh
#
# Or directly:
#   docker compose -f compose/docker-compose.yml --env-file /srv/openclaw/config/.env up -d --build
#
# AD-HOC COMMANDS (recreate one service, rebuild one image, etc.) MUST also
# pass --env-file /srv/openclaw/config/.env, OR pre-source it:
#   set -a; source /srv/openclaw/config/.env; set +a
#   docker compose up -d <service>
# Without one of these, ${OPENCLAW_GATEWAY_TOKEN}, ${TELEGRAM_BOT_TOKEN}, and
# friends substitute to empty strings; the gateway boots and crash-loops.
# scripts/deploy.sh handles this for you. Bypassing the script = remember the
# flag.
#
# Uniform service policy (log rotation 50MB×3, restart on-failure:5, per-service
# memory cap) is defined in the x-policy anchor below and merged into every
# long-lived service via `<<: *policy`. Individual services override the memory
# cap in their own `deploy.resources.limits.memory` block where needed.
# Rationale: see ~/memory/incidents/2026-05-20-vps-freeze.md — the full postmortem
# for the VPS freeze that motivated this hardening pass.
---
x-policy:
  policy: &policy
    init: true
    restart: on-failure:5
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1g

services:

  openclaw-gateway:
    <<: *policy
    build:
      context: ./openclaw-gateway
      args:
        OPENCLAW_BASE_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    image: lifekit-openclaw:local
    # Cross-project seam (devclaw spec 005): join the external lifekit-shared
    # network so the waiter can reach devclaw-mcp (in devclaw's own project) by
    # service name. `default` keeps in-project DNS to the other OpenClaw services.
    networks:
      - default
      - lifekit-shared
    deploy:
      resources:
        limits:
          memory: 6g
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      # Pin container-side paths so host paths from .env can't leak in (#77436).
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      OPENCLAW_DISABLE_BONJOUR: "1"   # we're behind a single-host network — no mDNS
      PATH: /home/node/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-/srv/openclaw/workspace}:/home/node/.openclaw/workspace
      - ${OPENCLAW_AUTH_PROFILE_SECRET_DIR:-/srv/openclaw/secret-key}:/home/node/.config/openclaw
      # Vault (~/memory): bind-mounted at two paths.
      # ~/memory — canonical alias used by cron jobs, skills, and agents.
      # ~/.openclaw/wiki/main — direct real bind mount (replaces symlink) so
      # OpenClaw wiki tools can traverse it without hitting the symlink guard.
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}:/home/node/memory
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}:/home/node/.openclaw/wiki/main
      - ${LIFEKIT_STATE_DIR_HOST:-/var/lib/lifekit}:/home/node/.life-state
      # Claude CLI session creds so the agent harness can authenticate to Anthropic.
      # Both the dir (.claude/) and the sibling .claude.json file are required —
      # .claude.json holds oauthAccount which tells the SDK this is a Pro
      # subscription session, not a raw API key. Without it, requests get billed
      # against API credits.
      - ${LIFEKIT_CLAUDE_HOME:-/home/lifekit/.claude}:/home/node/.claude
      - ${LIFEKIT_CLAUDE_JSON:-/home/lifekit/.claude.json}:/home/node/.claude.json
      # gh CLI auth for the Phase 5.5 code-task skill — set up once on the
      # host via `gh auth login` as lifekit user; container inherits the creds.
      - ${LIFEKIT_GH_CONFIG:-/home/lifekit/.config/gh}:/home/node/.config/gh
      # Host gitconfig (user.name/email) so commits land with the right author.
      - ${LIFEKIT_GITCONFIG:-/home/lifekit/.gitconfig}:/home/node/.gitconfig:ro
      # workout-claw CLI: prebuilt host checkout, installed -g at container
      # start (entrypoint). Sourced from the host clone rather than npm/GitHub
      # because the package was never published to npm and the GitHub repo is
      # archived (read-only). Keep /srv/workout-claw built (`npm run build`).
      - ${LIFEKIT_WORKOUT_CLAW_DIR:-/srv/workout-claw}:/opt/workout-claw:ro
      # workout-claw data store. The CLI hardcodes $HOME/.workout-claw
      # (src/lib/storage.ts); map it to the same logs dir under ~/.life so
      # sessions persist and match the host/PC layout.
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}/state/workout-claw:/home/node/.workout-claw
      # nutrition-claw data store. Same $HOME hardcode pattern as workout-claw.
      # This mount was missing when the CLI was linked into the persisted npm
      # prefix (2026-06-20), so the in-container store was ephemeral and meal
      # logs vanished on every recreate. Host dir is the canonical claw store.
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}/state/nutrition-claw:/home/node/.nutrition-claw
      # life-state data store. The CLI hardcodes $HOME/.life/state
      # (src/lib/storage.ts) with no env override; same persistence pattern as
      # the other two claws. Without this mount, daily state written in the
      # container vanished on every recreate (broken since 2026-05-27).
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}/state/life-state:/home/node/.life/state
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    # Loopback-only bind, per upstream Hetzner guidance.
    # Admin access goes through Tailscale + SSH tunnel.
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    entrypoint:
      - /bin/sh
      - -c
      - |
        export NPM_CONFIG_PREFIX=/home/node/.npm-global
        export PATH="/home/node/.npm-global/bin:$$PATH"
        if ! command -v claude >/dev/null 2>&1; then
          mkdir -p /home/node/.npm-global
          npm install -g @anthropic-ai/claude-code 2>&1 | tail -3
        fi
        if ! command -v clawhub >/dev/null 2>&1; then
          npm install -g clawhub 2>&1 | tail -3
        fi
        if ! command -v summarize >/dev/null 2>&1; then
          npm install -g @steipete/summarize 2>&1 | tail -3
        fi
        if ! command -v workout-claw >/dev/null 2>&1; then
          npm install -g /opt/workout-claw 2>&1 | tail -3
        fi
        if ! command -v nutrition-claw >/dev/null 2>&1; then
          npm install -g /home/node/.openclaw/agents/health/workspace/skills/nutrition-claw 2>&1 | tail -3
        fi
        if ! command -v life-state >/dev/null 2>&1; then
          npm install -g /home/node/.openclaw/agents/health/workspace/skills/life-state 2>&1 | tail -3
        fi
        exec "$$@"
      - --
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - ${OPENCLAW_GATEWAY_BIND:-lan}
      - --port
      - "18789"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-cli:
    <<: *policy
    # On-demand only — not started by `docker compose up -d`. Invoke via:
    #   docker compose --profile cli run --rm openclaw-cli <command>   (preferred)
    #   docker compose --profile cli up -d openclaw-cli                (persistent session)
    profiles:
      - cli
    image: lifekit-openclaw:local
    network_mode: "service:openclaw-gateway"
    depends_on:
      - openclaw-gateway
    deploy:
      resources:
        limits:
          memory: 512m
    stdin_open: true
    tty: true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      # Must mirror the gateway's env for the CLI to talk to the gateway on
      # privileged surfaces like `cron list`/`cron add`. Without
      # OPENCLAW_ALLOW_INSECURE_PRIVATE_WS the cli refuses plaintext WS for
      # those routes and the connection drops with a 1006 abnormal close
      # (observed on OpenClaw 2026.5.7 — non-cron commands like `sessions`
      # weren't affected, which is what made the bug confusing). Both env
      # vars need to match the gateway's settings.
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      OPENCLAW_DISABLE_BONJOUR: "1"
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      BROWSER: echo
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-/srv/openclaw/workspace}:/home/node/.openclaw/workspace
      - ${OPENCLAW_AUTH_PROFILE_SECRET_DIR:-/srv/openclaw/secret-key}:/home/node/.config/openclaw
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}:/home/node/memory
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}:/home/node/.openclaw/wiki/main
      - ${LIFEKIT_STATE_DIR_HOST:-/var/lib/lifekit}:/home/node/.life-state
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - node
      - dist/index.js

  lifekit-orchestrator:
    <<: *policy
    # RETIRED 2026-05-25 (v1 LangGraph scheduler). Replaced by devclaw-mcp's in-process queue.
    # Profile-gated so `docker compose up -d` never starts it.
    profiles:
      - orchestrator-v1
    image: lifekit-openclaw:local
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      - openclaw-gateway
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TZ: ${OPENCLAW_TZ:-UTC}
      LIFEKIT_TELEGRAM_CHAT: ${LIFEKIT_TELEGRAM_CHAT:-default}
      # Resolves to /home/node/.life-state inside the container — orchestrator.sqlite,
      # flat-bucket tasks/, intake_index.json. See proposal 2026-05-27-runtime-knowledge-split.
      LIFEKIT_STATE_DIR: /home/node/.life-state
      # Wire git credential helper via env, not gitconfig — the .gitconfig
      # bind-mount is read-only and `gh auth setup-git` would fail to write
      # to it ("Device or resource busy" because of how bind-mounted files
      # interact with git's atomic-rewrite). These vars make every git op
      # use gh for credentials without touching any file.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: "!gh auth git-credential"
    volumes:
      # Orchestrator source — installed editable at container start.
      - ${OPENCLAW_WORKSPACE_DIR:-/srv/openclaw/workspace}:/home/node/.openclaw/workspace
      # ~/.life is the knowledge layer the daemon reads project specs from.
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}:/home/node/memory
      # /.life-state is the runtime state the daemon owns — orchestrator.sqlite,
      # flat-bucket tasks/, intake_index.json. Split from the knowledge layer per
      # `system/proposals.md → 2026-05-27-runtime-knowledge-split`.
      - ${LIFEKIT_STATE_DIR_HOST:-/var/lib/lifekit}:/home/node/.life-state
      # Claude CLI session creds — same mounts as openclaw-gateway. Both the
      # dir and the sibling .claude.json are required for the SDK to recognize
      # the Pro subscription session.
      - ${LIFEKIT_CLAUDE_HOME:-/home/lifekit/.claude}:/home/node/.claude
      - ${LIFEKIT_CLAUDE_JSON:-/home/lifekit/.claude.json}:/home/node/.claude.json
      # gh CLI auth for the code_task runner.
      - ${LIFEKIT_GH_CONFIG:-/home/lifekit/.config/gh}:/home/node/.config/gh
      - ${LIFEKIT_GITCONFIG:-/home/lifekit/.gitconfig}:/home/node/.gitconfig:ro
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        export NPM_CONFIG_PREFIX=/home/node/.npm-global
        export PATH="/home/node/.npm-global/bin:/home/node/.orchestrator-venv/bin:$$PATH"
        if ! command -v claude >/dev/null 2>&1; then
          mkdir -p /home/node/.npm-global
          npm install -g @anthropic-ai/claude-code 2>&1 | tail -3
        fi
        if [ ! -x /home/node/.orchestrator-venv/bin/pip ]; then
          python3 -m venv /home/node/.orchestrator-venv
          /home/node/.orchestrator-venv/bin/pip install --upgrade pip --quiet
        fi
        # Re-run the editable install on EVERY container start. This re-pins the
        # devclaw-orchestrator entry point at the bind-mounted canonical source
        # under /home/node/.openclaw/workspace/devclaw/orchestrator. A code-task
        # runner inside the container can run `pip install -e .` from a /tmp
        # clone, and because this venv's pip is first on PATH it hijacks the
        # editable target — on next daemon restart the orchestrator would load
        # code from /tmp instead of the canonical source (observed 2026-05-18).
        # Re-installing every start is idempotent and fast, and undoes any such
        # hijack. Do NOT re-add the [ ! -x ... ] guard around this install.
        /home/node/.orchestrator-venv/bin/pip install -e /home/node/.openclaw/workspace/devclaw/orchestrator --quiet
        exec "$$@"
      - --
    command:
      - devclaw-orchestrator
      - daemon
      - --life
      - /home/node/memory
      - --telegram-chat
      - ${LIFEKIT_TELEGRAM_CHAT:-default}
    healthcheck:
      test:
        - CMD-SHELL
        - pgrep -f "devclaw-orchestrator daemon" >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  lifekit-dashboard:
    <<: *policy
    # Read-only UI surfacing state from ~/.life and ~/.openclaw/workspace.
    # Built from a VPS-local clone of lifekit-hq/lifekit-dashboard (see
    # scripts/deploy.sh) so the stack repo doesn't vendor the dashboard tree.
    build:
      context: ${LIFEKIT_DASHBOARD_DIR:-/srv/lifekit-dashboard}
    image: lifekit-dashboard:local
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      # The dashboard middleware reads OPENCLAW_GATEWAY_TOKEN (not a
      # dashboard-specific name) so it can validate gateway-issued requests
      # against the same shared secret openclaw-gateway uses.
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      ASPNETCORE_URLS: http://+:8080
      LIFEKIT_LIFE_ROOT: /life
      LIFEKIT_STATE_DIR: /life-state
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}:/life:ro
      - ${LIFEKIT_STATE_DIR_HOST:-/var/lib/lifekit}:/life-state:ro
      - ${OPENCLAW_WORKSPACE_DIR:-/srv/openclaw/workspace}:/openclaw-workspace:ro
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${LIFEKIT_DASHBOARD_PORT:-18790}:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # devclaw-mcp and devclaw-sandbox were removed here on 2026-08-15: devclaw is
  # deployed from its own repo now (devclaw spec 005). devclaw-mcp + ops-agent
  # run in devclaw's OWN compose project (defined in the devclaw repo), and the
  # sandbox image is pulled from ghcr by that project. This project only
  # PRODUCES the ops-agent image (see the build-only ops-agent stub below) and
  # keeps the OpenClaw services. The two projects integrate at runtime via the
  # external `lifekit-shared` network and the external `devclaw-state` volume.

  # Build-only — ops-agent is never run as a long-lived service in THIS project.
  # It publishes the ops-agent:local image, which is RUN by devclaw's OWN compose
  # project (devclaw spec 005) alongside devclaw-mcp. Keep it here so
  # `docker compose --profile build-only build ops-agent` still produces the
  # image; the placeholder command never executes because it's not in `up`
  # rotation. (Its runtime config — env/volumes/entrypoint/depends_on — moved to
  # devclaw's project.) Mirrors how devclaw-sandbox used to be a build-only stub.
  ops-agent:
    profiles: ["build-only"]
    build:
      context: ../ops-agent
    image: ops-agent:local
    # Placeholder command — service is never started via `up` in this project.
    command: ["true"]

  notify-relay:
    <<: *policy
    # Turns devclaw's notify_url POST into a Telegram message via direct
    # Telegram Bot API call. See compose/notify-relay/server.js.
    # No host port binding — devclaw reaches it on the compose network
    # at http://notify-relay:8090/devclaw.
    build:
      context: ./notify-relay
    image: notify-relay:local
    # Cross-project seam (devclaw spec 005): join the external lifekit-shared
    # network so devclaw-mcp (in devclaw's own project) can reach us by service
    # name at http://notify-relay:8090. `default` keeps in-project DNS.
    networks:
      - default
      - lifekit-shared
    deploy:
      resources:
        limits:
          memory: 128m
    environment:
      NOTIFY_RELAY_PORT: "8090"
      # notify-relay is devclaw's ONLY outbound voice, so it speaks through the
      # dedicated devclaw bot into the devclaw channel — NOT the main Kit bot.
      # (The inbound side, /goals/answer, is already on the devclaw bot; this
      # fixes the outbound asymmetry.) Falls back to the main bot/chat if the
      # devclaw-specific vars are unset.
      TELEGRAM_BOT_TOKEN: ${DEVCLAW_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      LIFEKIT_TELEGRAM_CHAT: ${DEVCLAW_CHAT:-${LIFEKIT_TELEGRAM_CHAT:-}}
      TZ: ${OPENCLAW_TZ:-UTC}
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    expose:
      - "8090"
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # NOTE: the prior health-claw MCP wrapper service was removed in the v2
  # cutover. workout-claw + life-state are now Kit's workspace skills (called
  # as bash by the single Kit agent), not an MCP-wrapped sibling container.
  # See architecture-openclaw-modular-monolith memory + docs/openclaw-agent-design.md.

  google-workspace-mcp:
    <<: *policy
    # taylorwilsdon/google_workspace_mcp — single-user, streamable-http on :8000.
    # OpenClaw gateway reaches it via service DNS at http://google-workspace-mcp:8000/mcp/.
    # Pin to a release tag; bump intentionally. See docs/google-mcp-setup.md.
    image: ghcr.io/taylorwilsdon/google_workspace_mcp:1.21.0
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      # OAuth client (Desktop type) from the user's Google Cloud project.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Single-user mode: identity of the Google account that owns the refresh token.
      USER_GOOGLE_EMAIL: ${USER_GOOGLE_EMAIL:-}
      # Service selection. Default mirrors the README, space- or comma-separated both work.
      # Upstream Dockerfile reads `TOOLS`; we expose the same value under the documented
      # `WORKSPACE_MCP_TOOLS` name (per upstream env reference) for forward-compat.
      WORKSPACE_MCP_TOOLS: ${WORKSPACE_MCP_TOOLS:-gmail drive calendar docs sheets tasks}
      TOOLS: ${WORKSPACE_MCP_TOOLS:-gmail drive calendar docs sheets tasks}
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      # Refresh-token store. Upstream image runs as non-root user `app`, so the
      # default credentials dir is /home/app/.google_workspace_mcp/credentials —
      # NOT /root/... Document the divergence in docs/google-mcp-setup.md.
      # Host dir is created by scripts/google-mcp-bootstrap.sh.
      - /srv/google-workspace-mcp/credentials:/home/app/.google_workspace_mcp/credentials
    # Internal-only — gateway reaches us via the compose network DNS name.
    # No `ports:` mapping: do not publish to the host.
    expose:
      - "8000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8000/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# ── Networks ────────────────────────────────────────────────────────────────
# `lifekit-shared` is an EXTERNAL network created and owned by devclaw's own
# compose project (devclaw spec 005). It's the cross-project seam: the waiter in
# openclaw-gateway reaches devclaw-mcp by service name, and devclaw reaches
# notify-relay by service name, across the project boundary. Only the two
# services that talk across it are attached (each also keeps `default` for
# in-project DNS). The devclaw-state named volume moved to devclaw's project too
# (mounted there as an external volume) — no service in THIS project uses it now.
networks:
  lifekit-shared:
    external: true
