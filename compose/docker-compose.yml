# lifekit-stack compose file.
#
# Services:
#   openclaw-gateway     — the runtime gateway (channels, cron, skills, agent); loopback bind on 18789
#   openclaw-cli         — same image, sharing the gateway's netns for one-shot `openclaw <command>` invocations.
#                          On-demand only (compose profile `cli`); not started by `docker compose up -d`.
#                          Invoke via: `docker compose --profile cli run --rm openclaw-cli <command>`
#   lifekit-dashboard    — read-only web UI over ~/memory and ~/.openclaw/workspace; loopback bind on 18790
#   google-workspace-mcp — taylorwilsdon/google_workspace_mcp, internal-only on :8000 (reached via compose DNS)
#   devclaw-mcp          — DevClaw v2 MCP server (autonomous coding via OpenHands); internal-only on :8000
#   notify-relay         — turns devclaw's notify_url POST into a Telegram message via the gateway CLI; internal-only on :8090
#
# Retired in the 2026-05-27 v2 cutover:
#   lifekit-orchestrator — v1 LangGraph scheduler; replaced by devclaw-mcp's in-process queue.
#
# Run from the repo root after `scripts/bootstrap-vps.sh` has set up the host:
#   cd /srv/lifekit-stack && ./scripts/deploy.sh
#
# Or directly:
#   docker compose -f compose/docker-compose.yml --env-file /srv/openclaw/config/.env up -d --build
#
# AD-HOC COMMANDS (recreate one service, rebuild one image, etc.) MUST also
# pass --env-file /srv/openclaw/config/.env, OR pre-source it:
#   set -a; source /srv/openclaw/config/.env; set +a
#   docker compose up -d <service>
# Without one of these, ${OPENCLAW_GATEWAY_TOKEN}, ${TELEGRAM_BOT_TOKEN}, and
# friends substitute to empty strings; the gateway boots and crash-loops.
# scripts/deploy.sh handles this for you. Bypassing the script = remember the
# flag.
#
# Uniform service policy (log rotation 50MB×3, restart on-failure:5, per-service
# memory cap) is defined in the x-policy anchor below and merged into every
# long-lived service via `<<: *policy`. Individual services override the memory
# cap in their own `deploy.resources.limits.memory` block where needed.
# Rationale: see ~/memory/incidents/2026-05-20-vps-freeze.md — the full postmortem
# for the VPS freeze that motivated this hardening pass.
---
x-policy:
  policy: &policy
    init: true
    restart: on-failure:5
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1g

services:

  openclaw-gateway:
    <<: *policy
    build:
      context: ./openclaw-gateway
      args:
        OPENCLAW_BASE_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    image: lifekit-openclaw:local
    deploy:
      resources:
        limits:
          memory: 6g
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      # Pin container-side paths so host paths from .env can't leak in (#77436).
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      OPENCLAW_DISABLE_BONJOUR: "1"   # we're behind a single-host network — no mDNS
      PATH: /home/node/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-/srv/openclaw/workspace}:/home/node/.openclaw/workspace
      - ${OPENCLAW_AUTH_PROFILE_SECRET_DIR:-/srv/openclaw/secret-key}:/home/node/.config/openclaw
      # Vault (~/memory): bind-mounted at two paths.
      # ~/memory — canonical alias used by cron jobs, skills, and agents.
      # ~/.openclaw/wiki/main — direct real bind mount (replaces symlink) so
      # OpenClaw wiki tools can traverse it without hitting the symlink guard.
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}:/home/node/memory
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}:/home/node/.openclaw/wiki/main
      - ${LIFEKIT_STATE_DIR_HOST:-/var/lib/lifekit}:/home/node/.life-state
      # Claude CLI session creds so the agent harness can authenticate to Anthropic.
      # Both the dir (.claude/) and the sibling .claude.json file are required —
      # .claude.json holds oauthAccount which tells the SDK this is a Pro
      # subscription session, not a raw API key. Without it, requests get billed
      # against API credits.
      - ${LIFEKIT_CLAUDE_HOME:-/home/lifekit/.claude}:/home/node/.claude
      - ${LIFEKIT_CLAUDE_JSON:-/home/lifekit/.claude.json}:/home/node/.claude.json
      # gh CLI auth for the Phase 5.5 code-task skill — set up once on the
      # host via `gh auth login` as lifekit user; container inherits the creds.
      - ${LIFEKIT_GH_CONFIG:-/home/lifekit/.config/gh}:/home/node/.config/gh
      # Host gitconfig (user.name/email) so commits land with the right author.
      - ${LIFEKIT_GITCONFIG:-/home/lifekit/.gitconfig}:/home/node/.gitconfig:ro
      # workout-claw CLI: prebuilt host checkout, installed -g at container
      # start (entrypoint). Sourced from the host clone rather than npm/GitHub
      # because the package was never published to npm and the GitHub repo is
      # archived (read-only). Keep /srv/workout-claw built (`npm run build`).
      - ${LIFEKIT_WORKOUT_CLAW_DIR:-/srv/workout-claw}:/opt/workout-claw:ro
      # workout-claw data store. The CLI hardcodes $HOME/.workout-claw
      # (src/lib/storage.ts); map it to the same logs dir under ~/.life so
      # sessions persist and match the host/PC layout.
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}/state/workout-claw:/home/node/.workout-claw
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    # Loopback-only bind, per upstream Hetzner guidance.
    # Admin access goes through Tailscale + SSH tunnel.
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    entrypoint:
      - /bin/sh
      - -c
      - |
        export NPM_CONFIG_PREFIX=/home/node/.npm-global
        export PATH="/home/node/.npm-global/bin:$$PATH"
        if ! command -v claude >/dev/null 2>&1; then
          mkdir -p /home/node/.npm-global
          npm install -g @anthropic-ai/claude-code 2>&1 | tail -3
        fi
        if ! command -v clawhub >/dev/null 2>&1; then
          npm install -g clawhub 2>&1 | tail -3
        fi
        if ! command -v summarize >/dev/null 2>&1; then
          npm install -g @steipete/summarize 2>&1 | tail -3
        fi
        if ! command -v workout-claw >/dev/null 2>&1; then
          npm install -g /opt/workout-claw 2>&1 | tail -3
        fi
        exec "$$@"
      - --
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - ${OPENCLAW_GATEWAY_BIND:-lan}
      - --port
      - "18789"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-cli:
    <<: *policy
    # On-demand only — not started by `docker compose up -d`. Invoke via:
    #   docker compose --profile cli run --rm openclaw-cli <command>   (preferred)
    #   docker compose --profile cli up -d openclaw-cli                (persistent session)
    profiles:
      - cli
    image: lifekit-openclaw:local
    network_mode: "service:openclaw-gateway"
    depends_on:
      - openclaw-gateway
    deploy:
      resources:
        limits:
          memory: 512m
    stdin_open: true
    tty: true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      # Must mirror the gateway's env for the CLI to talk to the gateway on
      # privileged surfaces like `cron list`/`cron add`. Without
      # OPENCLAW_ALLOW_INSECURE_PRIVATE_WS the cli refuses plaintext WS for
      # those routes and the connection drops with a 1006 abnormal close
      # (observed on OpenClaw 2026.5.7 — non-cron commands like `sessions`
      # weren't affected, which is what made the bug confusing). Both env
      # vars need to match the gateway's settings.
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      OPENCLAW_DISABLE_BONJOUR: "1"
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      BROWSER: echo
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-/srv/openclaw/workspace}:/home/node/.openclaw/workspace
      - ${OPENCLAW_AUTH_PROFILE_SECRET_DIR:-/srv/openclaw/secret-key}:/home/node/.config/openclaw
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}:/home/node/memory
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}:/home/node/.openclaw/wiki/main
      - ${LIFEKIT_STATE_DIR_HOST:-/var/lib/lifekit}:/home/node/.life-state
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - node
      - dist/index.js

  lifekit-orchestrator:
    <<: *policy
    # RETIRED 2026-05-25 (v1 LangGraph scheduler). Replaced by devclaw-mcp's in-process queue.
    # Profile-gated so `docker compose up -d` never starts it.
    profiles:
      - orchestrator-v1
    image: lifekit-openclaw:local
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      - openclaw-gateway
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TZ: ${OPENCLAW_TZ:-UTC}
      LIFEKIT_TELEGRAM_CHAT: ${LIFEKIT_TELEGRAM_CHAT:-default}
      # Resolves to /home/node/.life-state inside the container — orchestrator.sqlite,
      # flat-bucket tasks/, intake_index.json. See proposal 2026-05-27-runtime-knowledge-split.
      LIFEKIT_STATE_DIR: /home/node/.life-state
      # Wire git credential helper via env, not gitconfig — the .gitconfig
      # bind-mount is read-only and `gh auth setup-git` would fail to write
      # to it ("Device or resource busy" because of how bind-mounted files
      # interact with git's atomic-rewrite). These vars make every git op
      # use gh for credentials without touching any file.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: "!gh auth git-credential"
    volumes:
      # Orchestrator source — installed editable at container start.
      - ${OPENCLAW_WORKSPACE_DIR:-/srv/openclaw/workspace}:/home/node/.openclaw/workspace
      # ~/.life is the knowledge layer the daemon reads project specs from.
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}:/home/node/memory
      # /.life-state is the runtime state the daemon owns — orchestrator.sqlite,
      # flat-bucket tasks/, intake_index.json. Split from the knowledge layer per
      # `system/proposals.md → 2026-05-27-runtime-knowledge-split`.
      - ${LIFEKIT_STATE_DIR_HOST:-/var/lib/lifekit}:/home/node/.life-state
      # Claude CLI session creds — same mounts as openclaw-gateway. Both the
      # dir and the sibling .claude.json are required for the SDK to recognize
      # the Pro subscription session.
      - ${LIFEKIT_CLAUDE_HOME:-/home/lifekit/.claude}:/home/node/.claude
      - ${LIFEKIT_CLAUDE_JSON:-/home/lifekit/.claude.json}:/home/node/.claude.json
      # gh CLI auth for the code_task runner.
      - ${LIFEKIT_GH_CONFIG:-/home/lifekit/.config/gh}:/home/node/.config/gh
      - ${LIFEKIT_GITCONFIG:-/home/lifekit/.gitconfig}:/home/node/.gitconfig:ro
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        export NPM_CONFIG_PREFIX=/home/node/.npm-global
        export PATH="/home/node/.npm-global/bin:/home/node/.orchestrator-venv/bin:$$PATH"
        if ! command -v claude >/dev/null 2>&1; then
          mkdir -p /home/node/.npm-global
          npm install -g @anthropic-ai/claude-code 2>&1 | tail -3
        fi
        if [ ! -x /home/node/.orchestrator-venv/bin/pip ]; then
          python3 -m venv /home/node/.orchestrator-venv
          /home/node/.orchestrator-venv/bin/pip install --upgrade pip --quiet
        fi
        # Re-run the editable install on EVERY container start. This re-pins the
        # devclaw-orchestrator entry point at the bind-mounted canonical source
        # under /home/node/.openclaw/workspace/devclaw/orchestrator. A code-task
        # runner inside the container can run `pip install -e .` from a /tmp
        # clone, and because this venv's pip is first on PATH it hijacks the
        # editable target — on next daemon restart the orchestrator would load
        # code from /tmp instead of the canonical source (observed 2026-05-18).
        # Re-installing every start is idempotent and fast, and undoes any such
        # hijack. Do NOT re-add the [ ! -x ... ] guard around this install.
        /home/node/.orchestrator-venv/bin/pip install -e /home/node/.openclaw/workspace/devclaw/orchestrator --quiet
        exec "$$@"
      - --
    command:
      - devclaw-orchestrator
      - daemon
      - --life
      - /home/node/memory
      - --telegram-chat
      - ${LIFEKIT_TELEGRAM_CHAT:-default}
    healthcheck:
      test:
        - CMD-SHELL
        - pgrep -f "devclaw-orchestrator daemon" >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  lifekit-dashboard:
    <<: *policy
    # Read-only UI surfacing state from ~/.life and ~/.openclaw/workspace.
    # Built from a VPS-local clone of dsdevq/lifekit-dashboard (see
    # scripts/deploy.sh) so the stack repo doesn't vendor the dashboard tree.
    build:
      context: ${LIFEKIT_DASHBOARD_DIR:-/srv/lifekit-dashboard}
    image: lifekit-dashboard:local
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      # The dashboard middleware reads OPENCLAW_GATEWAY_TOKEN (not a
      # dashboard-specific name) so it can validate gateway-issued requests
      # against the same shared secret openclaw-gateway uses.
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      ASPNETCORE_URLS: http://+:8080
      LIFEKIT_LIFE_ROOT: /life
      LIFEKIT_STATE_DIR: /life-state
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}:/life:ro
      - ${LIFEKIT_STATE_DIR_HOST:-/var/lib/lifekit}:/life-state:ro
      - ${OPENCLAW_WORKSPACE_DIR:-/srv/openclaw/workspace}:/openclaw-workspace:ro
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${LIFEKIT_DASHBOARD_PORT:-18790}:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Build-only — devclaw-sandbox is never run as a long-lived service. It
  # publishes the devclaw-sandbox:local image that devclaw-mcp spawns one
  # container of per OpenHands task (via the host docker socket). Keep it
  # in the compose file so `docker compose build` covers it; the empty
  # entrypoint never executes because it's not in `up` rotation. Build with:
  #   docker compose -f compose/docker-compose.yml build devclaw-sandbox
  devclaw-sandbox:
    profiles: ["build-only"]
    build:
      context: ./devclaw-sandbox
      args:
        DEVCLAW_REF: ${DEVCLAW_REF:-main}
    image: devclaw-sandbox:local
    # Placeholder command — service is never started via `up`.
    command: ["true"]

  devclaw-mcp:
    <<: *policy
    # DevClaw v2 — autonomous coding runtime exposed via streamable-http MCP.
    # Replaces v1's lifekit-orchestrator container. Clones v2 source at build
    # time; inherits Claude Code OAuth via the bind-mounted ~/.claude session.
    # Slice 5: spawns one devclaw-sandbox container per task through the host
    # docker socket. The socket mount + group_add + path-translation envs
    # below make that work. Internal-only — no host port binding.
    # See compose/devclaw-mcp/README.md.
    build:
      context: ./devclaw-mcp
      args:
        DEVCLAW_REF: ${DEVCLAW_REF:-main}
    image: devclaw-mcp:local
    deploy:
      resources:
        limits:
          # 3g (raised from 1g on 2026-07-03) — devclaw spawns multiple
          # concurrent `claude --print` subprocesses per tick (planner,
          # decomposer, trend-detector, evaluator). Each Node.js Claude CLI
          # instance is 200-400MB during a call; 2-3 in parallel plus
          # devclaw's ~250MB base easily exceeds 1g and the kernel OOM
          # killer SIGKILLs whichever subprocess loses. See closeloop-mission
          # first-tick incident 2026-07-03T11:37Z: trend-detector + planner
          # both exited -9 at 3-7s after spawn. VPS has 15g total; 3g is
          # a comfortable ceiling for concurrent cognition without being wasteful.
          memory: 3g
    depends_on:
      - openclaw-gateway
    # group_add: grant the non-root `node` user access to the host docker
    # socket. The numeric GID must match the host's `docker` group (usually
    # 999 on Debian; override via env if your host differs).
    group_add:
      - "${LIFEKIT_DOCKER_GID:-999}"
    environment:
      DEVCLAW_TRANSPORT: http
      DEVCLAW_PORT: "8000"
      DEVCLAW_DB: /var/lib/devclaw/devclaw.db
      DEVCLAW_GOALS_DIR: /var/lib/devclaw/goals
      # Goal-layer milestone notifications → notify-relay's plain-text passthrough
      # → the devclaw Telegram channel. Without this the goal layer uses a
      # NullNotifier (silent), so kickoff→milestone pings never reach you.
      DEVCLAW_GOAL_NOTIFY_URL: http://notify-relay:8090/text
      # Notification altitude: 'owner' (default) sends only owner-facing events
      # (blocker / paused-for-review / direction question / verified completion).
      # 'task' is the full firehose (every dispatch + self-correction) — set
      # during dogfooding to watch a run closely; revert to 'owner' for normal use.
      DEVCLAW_NOTIFY_ALTITUDE: ${DEVCLAW_NOTIFY_ALTITUDE:-task}
      # Auto-merge gate-green milestone PRs to the default branch so a durable
      # goal iterates hands-off (the workspace resets to origin/main each action,
      # so without merging, milestone N+1 can't build on milestone N). Default
      # OFF (consequential for real repos — the done-gate review is the safety
      # net); set DEVCLAW_GOAL_AUTOMERGE=1 in .env to enable.
      DEVCLAW_GOAL_AUTOMERGE: ${DEVCLAW_GOAL_AUTOMERGE:-0}
      # fastmcp >= 3.4 ships HostOriginGuardMiddleware (DNS-rebinding
      # protection): any Host header outside 127.0.0.1/localhost/::1 gets a
      # 421 Misdirected Request BEFORE auth/routes run. The 2026-07-06
      # --no-cache rebuild pulled 3.4.3 and silently broke BOTH non-loopback
      # routes: the docker-network MCP endpoint (openclaw-gateway/ops-agent →
      # http://devclaw-mcp:8000/mcp) and the tailnet console
      # (https://lifekit-vps.tail1cb676.ts.net:18791/console via tailscale
      # serve, which forwards the tailnet Host as-is). Allowlist both; the
      # value is JSON because fastmcp's pydantic-settings parses list fields
      # from JSON env vars.
      FASTMCP_HTTP_ALLOWED_HOSTS: ${FASTMCP_HTTP_ALLOWED_HOSTS:-["devclaw-mcp:8000","lifekit-vps.tail1cb676.ts.net:18791"]}
      # Same guard, Origin half: Vite's built index.html loads its JS with
      # <script crossorigin>, so the browser sends an Origin header. Behind
      # tailscale serve, TLS terminates before uvicorn — the guard computes
      # the request origin as http://…, the browser says https://… — mismatch
      # → 403 Forbidden Origin on every console asset. Allowlist the console's
      # real browser origin.
      FASTMCP_HTTP_ALLOWED_ORIGINS: ${FASTMCP_HTTP_ALLOWED_ORIGINS:-["https://lifekit-vps.tail1cb676.ts.net:18791"]}
      CLAUDE_CODE_EXECUTABLE: /usr/local/bin/claude
      CLAUDE_CONFIG_DIR: /home/node/.claude
      OPENHANDS_SUPPRESS_BANNER: "1"
      # Sandcastle runner config (slice 5):
      #   DEVCLAW_SANDBOX_IMAGE        — which image to spawn per task
      #   DEVCLAW_HOST_CLAUDE_DIR      — host-side path to bind RO into the
      #                                  sandbox; differs from
      #                                  CLAUDE_CONFIG_DIR which is the
      #                                  container-side view
      #   DEVCLAW_CONTAINER_PATH_PREFIX/DEVCLAW_HOST_PATH_PREFIX — when the
      #     MCP server (in this container) is asked to create a workspace
      #     at /var/lib/devclaw/workspaces/<id>, sandcastle-runner swaps the
      #     prefix for the host's view of the same bind-mount so the
      #     spawned sandbox container can actually see it.
      # devclaw-sandbox-dotnet is the multi-runtime variant (Python + Node +
      # .NET 9 + .NET 10) — the right default now that the planning engine
      # (Pillar 1) routes goals at any of the supported stacks. Operators can
      # still set DEVCLAW_SANDBOX_IMAGE in the env to swap to a different
      # variant per host. The bare devclaw-sandbox:local image stays alive
      # as a fallback target; this just stops a fresh deploy from landing
      # on a sandbox that lacks dotnet (2026-06-26 regression).
      DEVCLAW_SANDBOX_IMAGE: ${DEVCLAW_SANDBOX_IMAGE:-devclaw-sandbox-dotnet:local}
      # Pillar 1 (decomposer + checklist + per-item dispatch) is the default
      # cognition path. Off keeps the legacy backlog-only mode; set to 0 in
      # the env to opt out per host while migrating existing goals.
      DEVCLAW_GOAL_DECOMPOSE: ${DEVCLAW_GOAL_DECOMPOSE:-1}
      # Firming phase (PhaseHandler #1, between investigating and executing) —
      # turns rough goals into structured goals that surface unanswered
      # questions to the owner via the answer_unknowns MCP tool before the
      # decomposer runs. Default off so legacy goals are unaffected; set
      # DEVCLAW_GOAL_FIRMING=1 in .env to enable per host.
      DEVCLAW_GOAL_FIRMING: ${DEVCLAW_GOAL_FIRMING:-0}
      # Trace-retention window (volume hygiene): keep 7 days of the traces
      # telemetry log instead of the code default of 30. This host is a single
      # long-lived instance whose devclaw.db grows fast (200k+ trace rows / ~400MB
      # observed 2026-07); 7 days is plenty of replay history while keeping the DB
      # small. The heartbeat prunes older rows daily (batched, pure SQLite) and a
      # weekly VACUUM reclaims the freed disk. `.env` can still override per host.
      DEVCLAW_TRACE_RETENTION_DAYS: ${DEVCLAW_TRACE_RETENTION_DAYS:-7}
      # 20 min covers the decomposer's structured-YAML generation pass
      # (sometimes 5-10 min on Sonnet for rich done_when text). 90 s — the
      # planner default — is fine for next-action + evaluator calls but too
      # tight for the decomposer (live regression 2026-06-26).
      DEVCLAW_PLANNER_TIMEOUT_MS: ${DEVCLAW_PLANNER_TIMEOUT_MS:-1200000}
      DEVCLAW_HOST_CLAUDE_DIR: ${LIFEKIT_CLAUDE_HOME:-/home/lifekit/.claude}
      DEVCLAW_CONTAINER_PATH_PREFIX: /var/lib/devclaw/workspaces
      DEVCLAW_HOST_PATH_PREFIX: ${LIFEKIT_DEVCLAW_WORKSPACES:-/srv/devclaw/workspaces}
      TZ: ${OPENCLAW_TZ:-UTC}
      # Wire git's credential helper to gh via env (same pattern as the
      # gateway). The goal layer clones repos orchestrator-side as `node`
      # (devclaw/workspace.py); without this, `git clone` of a PRIVATE repo
      # prompts for a username with no TTY and dies with
      # "could not read Username for 'https://github.com': No such device".
      # gh is installed in the image; this points git at gh's stored token.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: "!gh auth git-credential"
    volumes:
      # Persistent state — survives container recreates.
      - devclaw-state:/var/lib/devclaw
      # Workspaces — shared between this container and the per-task
      # devclaw-sandbox containers it spawns. Bind-mounted from the host
      # so docker (running on the host) can bind-mount the same path into
      # each spawned sandbox.
      - ${LIFEKIT_DEVCLAW_WORKSPACES:-/srv/devclaw/workspaces}:/var/lib/devclaw/workspaces
      # Host docker socket — REQUIRED for spawning sandcastle containers.
      # Grants effective root on the host; the no-new-privileges + cap_drop
      # above plus the non-root user inside this container are the only
      # mitigations. Acceptable here because devclaw-mcp's only network
      # input is the compose-internal MCP endpoint behind openclaw-gateway.
      - /var/run/docker.sock:/var/run/docker.sock
      # Host tailscaled control socket — lets the MCP server run `tailscale serve`
      # to expose durable deploys (deploy.py) on the tailnet, fully automatically.
      # tailscaled itself runs on the HOST; we mount only its socket. The host
      # socket is mode 0666, so the non-root `node` user can use it without a
      # `tailscale set --operator` grant. deploy.py degrades gracefully if it's
      # ever absent (returns the one-time serve command instead of failing).
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
      # Inherit Claude Code OAuth from the same files the gateway uses.
      - ${LIFEKIT_CLAUDE_HOME:-/home/lifekit/.claude}:/home/node/.claude
      - ${LIFEKIT_CLAUDE_JSON:-/home/lifekit/.claude.json}:/home/node/.claude.json
      # The vault — same pattern openclaw-cli / openclaw-gateway use. Lets the
      # trend detector persist harness-self retrospectives to
      # ~/memory/projects/devclaw/trends.md (Path.home() inside the container
      # resolves to /home/node) and read its own plan.md when reflecting.
      # Without this mount the harness-self file lands in the container's
      # ephemeral writable layer and is lost on restart.
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}:/home/node/memory
      # gh CLI auth so the goal layer can clone PRIVATE repos and open PRs.
      # Same host creds the gateway uses (`gh auth login` as lifekit). Pairs
      # with the GIT_CONFIG_* credential-helper env above.
      - ${LIFEKIT_GH_CONFIG:-/home/lifekit/.config/gh}:/home/node/.config/gh
      # Host gitconfig (user.name/email) so delivery commits get the right author.
      - ${LIFEKIT_GITCONFIG:-/home/lifekit/.gitconfig}:/home/node/.gitconfig:ro
      # Goals dir — durable goal state lives in the persisted devclaw-state
      # volume (DEVCLAW_GOALS_DIR=/var/lib/devclaw/goals), NOT the vault.
      # Decoupled 2026-06-20 (goalclaw abandoned) so goal runtime state never
      # lands in the git-synced ~/memory vault.
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    # Loopback-only host binding for the /dashboard SSE feed. Mirrors the
    # lifekit-dashboard (18790) and openclaw-gateway (18789) pattern: bound
    # to 127.0.0.1 so the port is reachable ONLY through an SSH tunnel,
    # never from the public IP. From a laptop:
    #   ssh -L 18791:127.0.0.1:18791 lifekit-vps
    #   open http://localhost:18791/dashboard
    # The /mcp endpoint still goes through the compose-internal openclaw-
    # gateway → devclaw-mcp:8000 hop — this binding only exposes the
    # observability surface.
    ports:
      - "127.0.0.1:18791:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fs http://127.0.0.1:8000/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  ops-agent:
    <<: *policy
    # ops-agent (ops-PR2) — resident watcher that detects stuck devclaw goals,
    # decides via a Claude playbook, and (for L1 only) calls devclaw's MCP
    # evaluate_goal tool. SEPARATE PROCESS from devclaw-mcp by design: when
    # the closeloop incident bit devclaw itself (~/memory/projects/devclaw/
    # plan.md → "Operations agent" section), an in-process self-heal handler
    # would have shared the same defect.
    #
    # ops-PR2 ships:
    #   - O1 detector (no-progress watchdog) + L0 (record incident).
    #   - Cognition: subprocess `claude --print` via the bind-mounted Pro
    #     OAuth session (no API key).
    #   - L1 action: MCP evaluate_goal(goal_id) against devclaw-mcp.
    # L2 (steer-injection), L3 (devclaw fix-PR), O2/O3 triggers stay deferred
    # to ops-PR3+. See ops-agent/README.md.
    build:
      context: ../ops-agent
    image: ops-agent:local
    depends_on:
      - devclaw-mcp
    # group_add: grant the non-root `node` user (uid 1000) access to the host
    # docker socket. Required by the ops-PR4 docker_restart action; without
    # this the socket is readable only by root + the host docker group, and
    # the subprocess wrapper errors with "permission denied". Mirrors the
    # devclaw-mcp pattern; the GID must match the host's docker group (990
    # on lifekit-vps, 999 on most Debian installs — override via env).
    group_add:
      - "${LIFEKIT_DOCKER_GID:-999}"
    deploy:
      resources:
        limits:
          # `claude --print --model sonnet` (cognition pass) needs ~1GB headroom;
          # 512m caused SIGKILL (-9) on every tick on lifekit-vps after the
          # ops-PR2 deploy. 2GB matches devclaw-mcp's own slice (which runs the
          # same CLI under the same OAuth session).
          memory: 2g
    environment:
      OPS_AGENT_GOALS_DIR: /data/goals
      OPS_AGENT_INCIDENTS_DIR: /data/incidents
      OPS_AGENT_POLL_INTERVAL_S: ${OPS_AGENT_POLL_INTERVAL_S:-60}
      OPS_AGENT_DEDUP_WINDOW_S: ${OPS_AGENT_DEDUP_WINDOW_S:-86400}
      # Cognition: claude CLI is installed in the image. The Pro OAuth
      # session is inherited via the ~/.claude bind-mount below (mirrors
      # devclaw-mcp's pattern — no API key, ever).
      OPS_AGENT_CLAUDE_MODEL: ${OPS_AGENT_CLAUDE_MODEL:-sonnet}
      OPS_AGENT_CLAUDE_TIMEOUT_S: ${OPS_AGENT_CLAUDE_TIMEOUT_S:-60}
      CLAUDE_CONFIG_DIR: /home/node/.claude
      # MCP client: target devclaw-mcp on the compose-internal network.
      # OPS_AGENT_DEVCLAW_MCP_TOKEN matches devclaw's DEVCLAW_TOKEN when set
      # (devclaw's bearer auth is off by default — see server/lifecycle.py).
      OPS_AGENT_DEVCLAW_MCP_URL: ${OPS_AGENT_DEVCLAW_MCP_URL:-http://devclaw-mcp:8000/mcp}
      OPS_AGENT_DEVCLAW_MCP_TOKEN: ${DEVCLAW_TOKEN:-}
      OPS_AGENT_DEVCLAW_MCP_TIMEOUT_S: ${OPS_AGENT_DEVCLAW_MCP_TIMEOUT_S:-30}
      # ops-PR4 — O3 (verifying-stall) + docker_restart action knobs.
      OPS_AGENT_VERIFYING_STALL_HOURS: ${OPS_AGENT_VERIFYING_STALL_HOURS:-4}
      OPS_AGENT_DOCKER_RESTART_ALLOWLIST: ${OPS_AGENT_DOCKER_RESTART_ALLOWLIST:-compose-devclaw-mcp-1}
      OPS_AGENT_DOCKER_TIMEOUT_S: ${OPS_AGENT_DOCKER_TIMEOUT_S:-30}
      # ops-PR6 — O4 (trend-signal-repeat) consumer. Ops-agent tails each
      # goal's <workspace>/.devclaw/trends.md (RO mount below) and emits an
      # incident when devclaw's own trend detector fires the same signal on
      # N consecutive daily runs. Threshold matches the field-validated
      # 2026-07-02 self-escalation. Unset OPS_AGENT_WORKSPACES_DIR → O4
      # gracefully no-ops (safe default before the mount is added).
      OPS_AGENT_WORKSPACES_DIR: /data/workspaces
      OPS_AGENT_TREND_REPEAT_THRESHOLD: ${OPS_AGENT_TREND_REPEAT_THRESHOLD:-3}
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      # Devclaw's goal store lives in the shared devclaw-state volume at
      # /var/lib/devclaw/goals (DEVCLAW_GOALS_DIR on devclaw-mcp above).
      # Mount the same volume here READ-ONLY — the boundary contract is that
      # ops-agent never mutates devclaw substrates directly.
      - devclaw-state:/data/devclaw-state:ro
      # Devclaw's workspaces host dir — RO. Enables O4 to read each goal's
      # <workspace>/.devclaw/trends.md. Same host path devclaw-mcp bind-
      # mounts RW above (LIFEKIT_DEVCLAW_WORKSPACES); here it's RO because
      # the ops-agent never mutates workspace state.
      - ${LIFEKIT_DEVCLAW_WORKSPACES:-/srv/devclaw/workspaces}:/data/workspaces:ro
      # Incident output dir — bind-mounted from the host so the owner can
      # browse incidents/log.md from their SSHFS session without needing to
      # docker exec in.
      #
      # NOTE: the host source dir MUST exist before `docker compose up`.
      # Docker will silently bind-mount a non-existent host path as a phantom
      # mount (link count 0); every write inside the container then fails with
      # FileNotFoundError. Bit us 2026-06-30 — 10 hours of crashed ticks
      # before the host dir was created. On a fresh deploy:
      #   sudo mkdir -p /srv/memory/projects/ops-agent
      #   sudo chown 1000:1000 /srv/memory/projects/ops-agent
      - ${LIFEKIT_OPS_AGENT_DIR:-/srv/memory/projects/ops-agent}:/data/incidents
      # Claude CLI session creds — READ-ONLY. Same pattern as devclaw-mcp
      # and openclaw-gateway. Both ~/.claude and the sibling .claude.json
      # are required for the SDK to recognize the Pro subscription session.
      - ${LIFEKIT_CLAUDE_HOME:-/home/lifekit/.claude}:/home/node/.claude:ro
      - ${LIFEKIT_CLAUDE_JSON:-/home/lifekit/.claude.json}:/home/node/.claude.json:ro
      # Host docker socket — REQUIRED for the docker_restart action (ops-PR4).
      # Grants effective root on the host. Mitigations: action wraps the
      # `docker restart` CLI only; service name is strictly allowlisted via
      # OPS_AGENT_DOCKER_RESTART_ALLOWLIST (default: just devclaw-mcp); no
      # other docker subcommands are reachable from the codepath; the
      # no-new-privileges + cap_drop above stay in force.
      - /var/run/docker.sock:/var/run/docker.sock
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    # Override OPS_AGENT_GOALS_DIR so it points inside the RO volume mount.
    command: ["ops-agent"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        export OPS_AGENT_GOALS_DIR=/data/devclaw-state/goals
        exec "$$@"
      - --

  notify-relay:
    <<: *policy
    # Turns devclaw's notify_url POST into a Telegram message via direct
    # Telegram Bot API call. See compose/notify-relay/server.js.
    # No host port binding — devclaw reaches it on the compose network
    # at http://notify-relay:8090/devclaw.
    build:
      context: ./notify-relay
    image: notify-relay:local
    deploy:
      resources:
        limits:
          memory: 128m
    environment:
      NOTIFY_RELAY_PORT: "8090"
      # notify-relay is devclaw's ONLY outbound voice, so it speaks through the
      # dedicated devclaw bot into the devclaw channel — NOT the main Kit bot.
      # (The inbound side, /goals/answer, is already on the devclaw bot; this
      # fixes the outbound asymmetry.) Falls back to the main bot/chat if the
      # devclaw-specific vars are unset.
      TELEGRAM_BOT_TOKEN: ${DEVCLAW_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      LIFEKIT_TELEGRAM_CHAT: ${DEVCLAW_CHAT:-${LIFEKIT_TELEGRAM_CHAT:-}}
      TZ: ${OPENCLAW_TZ:-UTC}
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    expose:
      - "8090"
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # NOTE: the prior health-claw MCP wrapper service was removed in the v2
  # cutover. workout-claw + life-state are now Kit's workspace skills (called
  # as bash by the single Kit agent), not an MCP-wrapped sibling container.
  # See architecture-openclaw-modular-monolith memory + docs/openclaw-agent-design.md.

  google-workspace-mcp:
    <<: *policy
    # taylorwilsdon/google_workspace_mcp — single-user, streamable-http on :8000.
    # OpenClaw gateway reaches it via service DNS at http://google-workspace-mcp:8000/mcp/.
    # Pin to a release tag; bump intentionally. See docs/google-mcp-setup.md.
    image: ghcr.io/taylorwilsdon/google_workspace_mcp:1.21.0
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      # OAuth client (Desktop type) from the user's Google Cloud project.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Single-user mode: identity of the Google account that owns the refresh token.
      USER_GOOGLE_EMAIL: ${USER_GOOGLE_EMAIL:-}
      # Service selection. Default mirrors the README, space- or comma-separated both work.
      # Upstream Dockerfile reads `TOOLS`; we expose the same value under the documented
      # `WORKSPACE_MCP_TOOLS` name (per upstream env reference) for forward-compat.
      WORKSPACE_MCP_TOOLS: ${WORKSPACE_MCP_TOOLS:-gmail drive calendar docs sheets tasks}
      TOOLS: ${WORKSPACE_MCP_TOOLS:-gmail drive calendar docs sheets tasks}
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      # Refresh-token store. Upstream image runs as non-root user `app`, so the
      # default credentials dir is /home/app/.google_workspace_mcp/credentials —
      # NOT /root/... Document the divergence in docs/google-mcp-setup.md.
      # Host dir is created by scripts/google-mcp-bootstrap.sh.
      - /srv/google-workspace-mcp/credentials:/home/app/.google_workspace_mcp/credentials
    # Internal-only — gateway reaches us via the compose network DNS name.
    # No `ports:` mapping: do not publish to the host.
    expose:
      - "8000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8000/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# ── Named volumes ──────────────────────────────────────────────────────────
volumes:
  devclaw-state:
    # SQLite state for DevClaw v2's task queue. Survives container recreates.
