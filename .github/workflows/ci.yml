name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Pre-commit (gitleaks, yamllint, shellcheck, hadolint, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1

  gitleaks-full:
    name: Gitleaks full-history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    if: false  # enable once ansible/playbook.yml exists
    steps:
      - uses: actions/checkout@v4
      - uses: ansible/ansible-lint@main
        with:
          working_directory: ansible

  templates-render:
    name: Jinja2 template render check
    runs-on: ubuntu-latest
    if: false  # enable once templates and a test harness exist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2-cli pyyaml
      - run: python scripts/test-render-all.py
