name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Pre-commit (gitleaks, yamllint, shellcheck, hadolint, ruff)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs history

      # setup-python@v5 can't provision Python on this arm64 self-hosted runner
      # ("version '3.13' ... not found for Debian 13"). The runner already ships
      # system python3 + python3-venv (installed by bootstrap), so run pre-commit
      # from a throwaway venv instead.
      - name: Run pre-commit
        run: |
          python3 -m venv "$RUNNER_TEMP/pcvenv"
          "$RUNNER_TEMP/pcvenv/bin/pip" install --quiet --upgrade pip pre-commit
          "$RUNNER_TEMP/pcvenv/bin/pre-commit" run --all-files --show-diff-on-failure --color=always

  gitleaks-full:
    name: Gitleaks full-history scan
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GH Actions Artifact storage is quota-blocked by the
          # account-lock; we don't need the SARIF upload — gitleaks's
          # own exit code is the gate.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  deploy:
    name: Deploy to VPS
    needs: [lint, gitleaks-full]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Deploy
        run: |
          cd /srv/lifekit-stack
          git fetch origin main
          git reset --hard origin/main
          bash scripts/deploy.sh

      - name: Smoke check
        run: |
          cd /srv/lifekit-stack
          docker compose -f compose/docker-compose.yml --env-file /srv/openclaw/config/.env ps \
            --format "table {{.Service}}\t{{.State}}\t{{.Status}}"
