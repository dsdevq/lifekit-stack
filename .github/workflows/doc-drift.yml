name: Doc drift

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  doc-drift:
    name: README <-> compose service-count parity
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Run check-doc-drift.sh
        run: bash scripts/check-doc-drift.sh
